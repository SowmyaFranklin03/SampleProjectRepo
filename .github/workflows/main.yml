name: .NET CI Pipeline
on:
 push:
   branches: [ "main" ]
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
   - name: Checkout Code
     uses: actions/checkout@v4
   - name: Setup .NET
     uses: actions/setup-dotnet@v4
     with:
       dotnet-version: '8.0.x'
   - name: Restore Dependencies
     run: dotnet restore SampleWeb/SampleWeb.csproj
   - name: Build project
     run: dotnet build SampleWeb/SampleWeb.csproj --configuration Release --no-restore
   - name: Publish project
     run: dotnet publish SampleWeb/SampleWeb.csproj -c Release -o ./publish
   - name: Upload Artifact
     uses: actions/upload-artifact@v4
     with:
       name: dotnet-web-app
       path: publish
